# MORGAN Travelers — data pipeline (Phases 1–3)
# Builds / collects routing artifacts, generates metadata.json, syncs to R2,
# and posts Discord/Slack/Telegram-compatible webhook status.
#
# Required secrets:
#   R2_ACCOUNT_ID
#   R2_ACCESS_KEY_ID
#   R2_SECRET_ACCESS_KEY
#   R2_BUCKET_NAME          (e.g. hk-routing-data)
#   WEBHOOK_URL             (Discord/Slack/Telegram bot webhook)
#
# Optional secrets / vars:
#   DATA_PUBLIC_BASE_URL    (default: https://hk-gtfsdata.morgandev.cc)
#   ARTIFACT_SOURCE         (optional: URL or workflow to fetch prebuilt artifacts)

name: GTFS Data Pipeline

on:
  schedule:
    # Daily at 16:00 UTC (~00:00 HKT)
    - cron: "0 16 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/pipeline.yml"
      - "scripts/**"
      - "src/**"
      - "functions/**"
      - "index.html"
      - "vite.config.js"
      - "package.json"
      - "package-lock.json"

env:
  DATA_PUBLIC_BASE_URL: ${{ vars.DATA_PUBLIC_BASE_URL || 'https://hk-gtfsdata.morgandev.cc' }}
  ARTIFACTS_DIR: artifacts

jobs:
  build-and-sync:
    name: Build · Metadata · R2 Sync
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: gtfs-pipeline
      cancel-in-progress: true
    # Data job only on pushes that touch the data pipeline itself; frontend
    # pushes still trigger this workflow but only the frontend-check job below.
    # github.event.head_commit is null on schedule/dispatch — short-circuit first.
    if: >-
      github.event_name != 'push' ||
      (github.event.head_commit != null &&
       (contains(join(github.event.head_commit.modified, ' '), 'scripts/generate-metadata.mjs') ||
        contains(join(github.event.head_commit.added, ' '), 'scripts/generate-metadata.mjs') ||
        contains(join(github.event.head_commit.removed, ' '), 'scripts/generate-metadata.mjs') ||
        contains(join(github.event.head_commit.modified, ' '), '.github/workflows/pipeline.yml')))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare artifacts directory
        run: mkdir -p "${{ env.ARTIFACTS_DIR }}"

      # ── Phase 1 / 2: produce or collect build artifacts ──────────────────
      # If your GTFS / PMTiles build lives in this repo, replace the download
      # steps below with the real build commands. Until then, this job will
      # re-pull the currently published edge assets so metadata + notify still run.
      - name: Collect published artifacts (fallback when local build absent)
        id: collect
        env:
          BASE: ${{ env.DATA_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p "${{ env.ARTIFACTS_DIR }}"

          download() {
            local name="$1"
            local dest="${{ env.ARTIFACTS_DIR }}/${name}"
            echo "Fetching ${BASE}/${name} …"
            if curl -fL --retry 3 --retry-delay 5 -o "${dest}" "${BASE}/${name}"; then
              echo "  OK $(wc -c < "${dest}" | tr -d ' ') bytes"
            else
              echo "  WARN: ${name} not available at edge"
              rm -f "${dest}"
            fi
          }

          download "hk.gtfs.zip"
          download "hongkong.pmtiles"
          download "mtravelers-graph.dense"

          # Require GTFS + PMTiles for a successful publish
          test -f "${{ env.ARTIFACTS_DIR }}/hk.gtfs.zip"
          test -f "${{ env.ARTIFACTS_DIR }}/hongkong.pmtiles"

      # ── Phase 3 Step 1: Generate data manifest ───────────────────────────
      - name: Generate metadata.json
        run: |
          node scripts/generate-metadata.mjs \
            "${{ env.ARTIFACTS_DIR }}" \
            "${{ env.ARTIFACTS_DIR }}/metadata.json" \
            "${{ env.DATA_PUBLIC_BASE_URL }}"
          echo "── metadata.json ──"
          cat "${{ env.ARTIFACTS_DIR }}/metadata.json"

      - name: Configure AWS CLI for Cloudflare R2
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws-region: auto

      - name: Sync artifacts + metadata to R2
        env:
          AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          # Large binary archives — long cache; clients discover freshness via metadata.json
          for f in hk.gtfs.zip hongkong.pmtiles mtravelers-graph.dense; do
            if [ -f "${{ env.ARTIFACTS_DIR }}/${f}" ]; then
              aws s3 cp \
                "${{ env.ARTIFACTS_DIR }}/${f}" \
                "s3://${BUCKET}/${f}" \
                --endpoint-url "${AWS_ENDPOINT_URL}" \
                --cache-control "public, max-age=86400, stale-while-revalidate=604800"
            fi
          done

          # Manifest — short cache so clients see updates quickly
          aws s3 cp \
            "${{ env.ARTIFACTS_DIR }}/metadata.json" \
            "s3://${BUCKET}/metadata.json" \
            --endpoint-url "${AWS_ENDPOINT_URL}" \
            --content-type "application/json" \
            --cache-control "public, max-age=60, stale-while-revalidate=300"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: routing-data-metadata
          path: |
            ${{ env.ARTIFACTS_DIR }}/metadata.json
          retention-days: 14

      # ── Phase 3 Step 3: Pipeline health alerts ───────────────────────────
      - name: Notify Build Status
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_URL:-}" ]; then
            echo "WEBHOOK_URL secret not set — skipping notify"
            exit 0
          fi

          ICON="✅"
          if [ "${STATUS}" != "success" ]; then ICON="❌"; fi

          META=""
          if [ -f "${{ env.ARTIFACTS_DIR }}/metadata.json" ]; then
            META=$(cat "${{ env.ARTIFACTS_DIR }}/metadata.json" | tr -d '\n' | cut -c1-500)
          fi

          # Discord-compatible payload (also works with many Slack-incoming-style hooks)
          BODY=$(jq -n \
            --arg content "${ICON} GTFS Pipeline Build Status: ${STATUS}" \
            --arg status "${STATUS}" \
            --arg run "${RUN_URL}" \
            --arg meta "${META}" \
            '{
              content: $content,
              embeds: [{
                title: "MORGAN Travelers · Data Pipeline",
                description: ("Status: **" + $status + "**\n[View run](" + $run + ")"),
                color: (if $status == "success" then 5763719 else 15548997 end),
                fields: (
                  if $meta != "" then
                    [{ name: "metadata.json", value: ("```json\n" + $meta + "\n```") }]
                  else [] end
                )
              }]
            }')

          # Discord-compatible JSON; many Slack/generic hooks accept the same content field.
          curl -fsS -H "Content-Type: application/json" \
            -X POST \
            -d "${BODY}" \
            "${WEBHOOK_URL}"

  # Frontend changes (src/, functions/, config) get a mechanical pass/fail
  # signal before review: syntax-check + production build via npm run check.
  frontend-check:
    name: Frontend Build · Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run project check (syntax + build)
        run: npm run check

      - name: Upload check result
        uses: actions/upload-artifact@v4
        with:
          name: frontend-check-result
          path: dist/
          retention-days: 7
