# Cloudflare Pages
# Plain-text env vars live here ([vars]). Dashboard can only edit *Secrets*.
# Local: npx wrangler pages dev dist
#
# name is used when deploying via Wrangler; CF dashboard project name may differ.

name = "morgan-travelers"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

# ── Non-secret runtime variables (committed; edit here + push to update) ──
[vars]
OVERRIDES_REPO = "UNGemini/morgan-travelers-overrides"
OVERRIDES_BASE_BRANCH = "main"
# Optional (public OAuth client id is fine in vars once you have an App):
# GITHUB_OAUTH_CLIENT_ID = "Iv1.xxxxxxxx"
# Defaults to request origin + /api/auth/callback if unset:
# GITHUB_OAUTH_REDIRECT_URI = "https://travelers.morgandev.cc/api/auth/callback"

# ── Secrets — set only in Dashboard (or: wrangler pages secret put NAME) ──
# Do NOT put real values in this file.
#   OVERRIDES_GITHUB_TOKEN      # fine-grained PAT → overrides repo (bot PRs)
#   GITHUB_OAUTH_CLIENT_SECRET  # OAuth App secret
#   GITHUB_OAUTH_CLIENT_ID      # optional as Secret if you prefer not to commit it
#   GITHUB_OAUTH_REDIRECT_URI   # optional as Secret once you know production URL
#   CONTRIBUTE_WEBHOOK_URL      # Discord/Slack notify (optional)
#   GITHUB_TOKEN                # fallback for OVERRIDES_GITHUB_TOKEN

# Uncomment after creating resources in the Cloudflare dashboard:
#
# [[kv_namespaces]]
# binding = "CONTRIBUTIONS"
# id = "<your-kv-namespace-id>"
#
# [[r2_buckets]]
# binding = "CONTRIBUTIONS_BUCKET"
# bucket_name = "morgan-path-contributions"
